<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock & Countdown Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Digital Clock & Countdown Timer</h1>
        
        <!-- Digital Clock Section -->
        <div class="clock-section">
            <h2>Current Time</h2>
            <div id="clock" class="clock-display">00:00:00</div>
        </div>

        <!-- Countdown Timer Section -->
        <div class="timer-section">
            <h2>Countdown Timer</h2>
            <p>Days until New Year 2027:</p>
            <div id="countdown" class="timer-display">00:00:00:00</div>
            <p class="timer-label">Days : Hours : Minutes : Seconds</p>
        </div>
    </div>

    <script src="scriptclock.js"></script>
</body>
</html>
